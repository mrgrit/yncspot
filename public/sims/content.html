<style>
  :root{
    --paper:#FFF7F2;--card:#FFFFFF;--soft:#FFF1E9;
    --ink:#4A3A44;--ink2:#8D7A86;--ink3:#BCACB6;
    --pink:#FF8FAA;--pinkL:#FFE2E9;
    --mint:#4FC9AE;--mintL:#D5F5EC;
    --butter:#FFB94A;--butterL:#FFEECE;
    --lilac:#A187E2;--lilacL:#EBE3FC;
    --sky:#5FB6DE;--skyL:#DBEFFA;
    --red:#F26B68;--redL:#FFE1E0;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  svg{image-rendering:pixelated;display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 64px}
  button{font-family:var(--sans);cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

  /* ── header ── */
  header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
  .who{display:flex;align-items:center;gap:14px}
  .avat{background:var(--butterL);border:3px solid var(--ink);border-radius:22px;padding:7px 9px;box-shadow:4px 4px 0 var(--butter)}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .who p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 13px;text-align:center;min-width:78px;box-shadow:3px 3px 0 var(--pinkL)}
  .pill span{display:block;font-size:10.5px;color:var(--ink2);font-weight:600}
  .pill b{font-size:19px;font-weight:700}
  .pill.m{box-shadow:3px 3px 0 var(--mintL)} .pill.b{box-shadow:3px 3px 0 var(--butterL)} .pill.l{box-shadow:3px 3px 0 var(--lilacL)}

  /* ── tabs ── */
  .tabs{display:flex;gap:9px;margin-bottom:16px}
  .tabs button{font-size:14px;font-weight:700;padding:9px 22px;background:var(--card);border:3px solid var(--ink);border-radius:16px;color:var(--ink2);box-shadow:3px 3px 0 var(--soft)}
  .tabs button[aria-selected="true"]{background:var(--butterL);color:var(--ink);box-shadow:3px 3px 0 var(--butter)}

  /* ── section ── */
  .sec{margin-bottom:22px}
  .st{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:14px 14px 0 0;border-bottom:0;padding:7px 16px;font-weight:700;font-size:14px;position:relative;top:3px}
  .body{background:var(--card);border:3px solid var(--ink);border-radius:0 18px 18px 18px;padding:18px;box-shadow:5px 5px 0 var(--soft)}
  .no{font-size:13px;font-weight:800;color:var(--pink)}

  /* ── stage 1 ── */
  .front{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .fs{background:var(--soft);border:2.5px solid var(--ink);border-radius:16px;padding:13px 15px}
  .fs.need{background:var(--redL)}
  .fs .k{font-size:11px;font-weight:700;color:var(--ink2)}
  .fs .t{font-size:14.5px;font-weight:700;margin:2px 0 4px}
  .fs .d{font-size:12.5px;color:var(--ink2);line-height:1.55}
  .fs .m{font-size:12px;font-weight:700;color:var(--mint);margin-top:7px}
  .fs.need .m{color:var(--red)}
  .mini{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .mini button{font-size:12px;font-weight:600;padding:6px 12px;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;color:var(--ink2)}
  .mini button[aria-pressed="true"]{background:var(--pinkL);color:var(--ink);box-shadow:2px 2px 0 var(--pink)}

  /* ── stage 2 ── */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
  .ch{border:3px solid var(--ink);border-radius:16px;padding:11px;background:var(--card);transition:transform .12s}
  .ch:hover{transform:translateY(-3px)}
  .ch.sel{box-shadow:4px 4px 0 var(--ink)}
  .ch.off{opacity:.45}
  .ch .cap{border-radius:11px;padding:9px 0;display:flex;justify-content:center;border:2.5px solid var(--ink);margin-bottom:8px}
  .ch .nm{font-size:12.5px;font-weight:700;line-height:1.3;cursor:pointer}
  .ch .kd{font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;display:inline-block;margin-top:4px}
  .kd.real{background:var(--mintL);color:#1F7A66} .kd.virt{background:var(--lilacL);color:#5B3EA8}
  .ch .who2{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;font-weight:600;color:var(--ink3);min-height:20px}
  .ch .who2.on{color:var(--mint)}
  .sw{width:100%;margin-top:8px;font-size:11.5px;font-weight:700;padding:6px;border:2.5px solid var(--ink);border-radius:11px;background:var(--card);color:var(--ink3)}
  .sw.on{background:var(--mintL);color:#1F7A66}

  /* ── stage 3 ── */
  .det{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr) minmax(0,1.25fr);gap:14px}
  .dc{background:var(--soft);border:2.5px solid var(--ink);border-radius:16px;padding:14px}
  .cl{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:9px}
  .box{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:9px 11px;font-size:12.5px;color:var(--ink2)}
  .box+.box{margin-top:7px}
  .box b{display:block;color:var(--ink);font-size:12.5px}
  .slot{background:var(--card);border:2.5px dashed var(--ink3);border-radius:14px;padding:13px;text-align:center;margin-bottom:11px}
  .slot.on{border-style:solid;border-color:var(--ink);background:var(--mintL)}
  .slot svg{margin:0 auto 6px}
  .slot .an{font-size:13px;font-weight:700}
  .slot .ar{font-size:11.5px;color:var(--ink2)}
  .slot .em{font-size:12px;color:var(--ink2);line-height:1.55}
  .dial{margin-bottom:11px}
  .dial .dl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
  .dial .dv{color:var(--pink);font-weight:700}
  input[type=range]{width:100%;accent-color:var(--pink);height:22px}
  .prev{background:var(--card);border:2px solid var(--ink);border-radius:13px;padding:11px 13px}
  .prev+.prev{margin-top:8px}
  .prev .ph{font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:3px}
  .prev .pt{font-size:13.5px;font-weight:600}
  .prev .pm{font-size:12px;color:var(--ink2);margin-top:4px}
  .tags{font-size:11.5px;color:var(--sky);font-weight:600;margin-top:6px;word-break:break-all;line-height:1.7}

  .note{border:2.5px solid var(--ink);border-radius:13px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:9px}
  .note.warn{background:var(--redL);color:#A83A38}
  .note.pass{background:var(--mintL);color:#1F7A66}
  .note.man{background:var(--butterL);color:#8A5A05}
  .note.rule{background:var(--skyL);color:#245B78}
  .note.rule b{color:#123f57}

  .btn{display:block;width:100%;font-size:13.5px;font-weight:700;padding:11px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--soft)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--soft)}
  .btn.go{background:var(--mintL);box-shadow:3px 3px 0 var(--mint)}
  .btn.big{background:var(--butterL);box-shadow:4px 4px 0 var(--butter);font-size:15px;padding:13px}
  .btn.ok{background:var(--pinkL);box-shadow:3px 3px 0 var(--pink)}

  .log{background:var(--soft);border:2.5px solid var(--ink);border-radius:14px;padding:11px 14px;font-size:12.5px;color:var(--ink2);max-height:140px;overflow:auto;margin-top:12px}
  .log div{padding:2px 0}
  .log .ok{color:#1F7A66;font-weight:600} .log .hd{color:#A83A38;font-weight:600} .log .vt{color:#5B3EA8;font-weight:600}

  /* ── 발행 캘린더 ── */
  #cal{overflow-x:auto}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:9px}
  .cal .day{border:2.5px solid var(--ink);border-radius:12px;padding:7px 6px 9px;min-height:66px;background:var(--soft)}
  .cal .dh{font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:5px;text-align:center}
  .cal .cd{font-size:10px;font-weight:700;border-radius:8px;padding:3px 5px;margin-top:4px;display:flex;align-items:center;gap:4px;border:2px solid var(--ink);background:var(--card);line-height:1.2}
  .cal .cdot{width:8px;height:8px;border-radius:3px;flex:0 0 auto;border:1px solid var(--ink)}
  .cal .empty{font-size:10px;color:var(--ink3);text-align:center;margin-top:12px}

  /* ── stage 5 ── */
  .pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .pc{border:2.5px solid var(--ink);border-radius:16px;padding:13px;background:var(--card)}
  .pc .pn{font-size:13px;font-weight:700}
  .pc .pk{font-size:11px;color:var(--ink2)}
  .pc .pv{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .pc .pv b{font-size:23px;font-weight:800}
  .pc .pv i{font-style:normal;font-size:12px;color:var(--ink2)}
  .pc .dlt{font-size:10.5px;font-weight:700;margin-top:6px;display:inline-block;padding:2px 9px;border-radius:9px;border:2px solid var(--ink)}
  .dlt.up{background:var(--mintL);color:#1F7A66} .dlt.down{background:var(--redL);color:#A83A38} .dlt.same{background:var(--soft);color:var(--ink2)}
  .pc .q{display:flex;justify-content:space-between;align-items:center;margin-top:8px;background:var(--soft);border-radius:11px;padding:6px 10px}
  .pc .q span{font-size:11.5px;font-weight:600;color:var(--ink2)}
  .pc .q em{font-style:normal;font-size:14px;font-weight:800}
  .pc .rev{font-size:11.5px;color:var(--ink2);margin-top:7px;line-height:1.5}

  .tl{margin-left:8px;padding-left:18px;border-left:3px solid var(--ink3)}
  .tl div{position:relative;padding:6px 0;font-size:12.5px;color:var(--ink2)}
  .tl div:before{content:"";position:absolute;left:-25px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--ink3)}
  .tl div.ok:before{background:var(--mint);border-color:var(--ink)}
  .tl div.no:before{background:var(--red);border-color:var(--ink)}
  .tl b{color:var(--ink)}
  .tl .w{font-weight:700;color:var(--ink3);margin-right:8px;font-size:11.5px}

  .ins{background:var(--lilacL);border:3px solid var(--ink);border-radius:16px;padding:15px 17px;margin-top:16px;box-shadow:4px 4px 0 var(--lilac)}
  .ins .it{font-size:14.5px;font-weight:700;margin-bottom:7px}
  .ins ul{margin:0 0 12px;padding-left:18px;font-size:12.5px;color:var(--ink2)}
  .ins li{padding:3px 0}
  .money{background:var(--soft);border:2.5px dashed var(--ink3);border-radius:14px;padding:10px 14px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .money .ml{font-size:12px;color:var(--ink2);font-weight:600}
  .money .mv{font-size:16px;font-weight:700;color:var(--ink2)}
  .money .mv em{font-style:normal;font-size:12px;font-weight:700;margin-left:6px}

  /* ── portfolio ── */
  .pfh{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .pfh .nm b{font-size:19px;font-weight:800;display:block}
  .pfh .nm span{font-size:12px;color:var(--ink2)}
  .pfb{display:flex;gap:7px;flex-wrap:wrap}
  .pb{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:12px;border:2.5px solid var(--ink);background:var(--card)}
  .pb.g{background:var(--mintL)} .pb.t{background:var(--skyL)} .pb.y{background:var(--butterL)}
  .wg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .wk{border:3px solid var(--ink);border-radius:16px;padding:11px;background:var(--card);box-shadow:4px 4px 0 var(--soft)}
  .wk:nth-child(3n){transform:rotate(-1.2deg)}
  .wk:nth-child(3n+2){transform:rotate(.9deg)}
  .wk .th{border:2.5px solid var(--ink);border-radius:12px;padding:12px 0;display:flex;justify-content:center;margin-bottom:9px}
  .wk .wn{font-size:13px;font-weight:700}
  .wk .wc{font-size:11.5px;color:var(--ink2)}
  .wk .wm{font-size:12px;font-weight:700;color:var(--mint);margin-top:7px;border-top:2px dashed var(--ink3);padding-top:7px}
  .share{background:var(--skyL);border:2.5px solid var(--ink);border-radius:13px;padding:10px 14px;margin-top:16px;font-size:12.5px;font-weight:600;word-break:break-all}
  .none{color:var(--ink2);font-size:13px;text-align:center;padding:26px;border:2.5px dashed var(--ink3);border-radius:16px}

  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.front,.det{grid-template-columns:1fr}.pgrid,.wg{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cal{min-width:480px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}.wk{transform:none!important}}
</style>

<script>
const $=i=>document.getElementById(i);
const F=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const N=n=>n.toLocaleString();
function cat(m,s){const D="#4A3A44";let e;
 if(m===1)e=F(5,6,3,1,D)+F(9,6,3,1,D);
 else if(m===2)e=F(5,6,2,2,D)+F(10,6,2,2,D);
 else if(m===3)e=F(5,5,1,3,D)+F(6,7,1,1,D)+F(9,5,1,3,D)+F(10,7,1,1,D);
 else e=F(5,6,2,2,D)+F(9,6,2,2,D);
 const mo=m===2?F(6,9,4,1,D)+F(6,10,1,1,D)+F(9,10,1,1,D):m===3?F(6,10,4,1,D):F(7,9,2,1,D);
 return `<svg viewBox="0 0 16 16" width="${s}" height="${s}">`+F(3,3,10,9,"#E8B87A")+F(3,2,2,3,"#E8B87A")+F(11,2,2,3,"#E8B87A")
  +F(4,4,3,2,"#F5D6AE")+e+mo+`</svg>`;}
function fairy(c,s){return `<svg viewBox="0 0 16 16" width="${s}" height="${s}">`
 +F(4,1,8,3,"#5C4658")+F(5,4,6,4,"#F3D3B8")+F(6,5,1,1,"#4A3A44")+F(9,5,1,1,"#4A3A44")+F(7,6,2,1,"#E28B9E")
 +F(4,8,8,5,c)+F(5,13,2,3,"#5C4658")+F(9,13,2,3,"#5C4658")+`</svg>`;}
function glyph(g,c){return `<svg viewBox="0 0 16 16" width="24" height="24">`+g.map(r=>F(r[0],r[1],r[2],r[3],r[4]||c)).join("")+`</svg>`;}
function bar(v,c){const mx=Math.max(...v)||1;
 return `<svg viewBox="0 0 76 24" width="76" height="24">`+v.map((x,i)=>F(i*10,24-Math.max(3,x/mx*22),7,Math.max(3,x/mx*22),c)).join("")+`</svg>`;}
function series(f,n){const a=[];for(let i=0;i<n;i++)a.push(Math.round(f*(0.32+0.68*i/(n-1))*(0.88+((i*41)%17)/70)));a[n-1]=Math.round(f);return a;}
function gr(){return 1+(CYC-1)*0.09;}

const G={cam:[[2,4,12,9],[6,2,4,2],[6,7,4,4,"#FFF7F2"]],play:[[2,3,12,10],[6,6,2,4,"#FFF7F2"],[8,7,2,2,"#FFF7F2"]],
 doc:[[3,1,10,14],[5,4,6,1,"#FFF7F2"],[5,7,6,1,"#FFF7F2"],[5,10,4,1,"#FFF7F2"]],chat:[[2,3,12,8],[5,12,3,2],[5,6,6,1,"#FFF7F2"]],
 stk:[[3,2,10,12],[9,10,4,4,"#FFF7F2"],[5,5,2,2,"#FFF7F2"],[9,5,2,2,"#FFF7F2"]],tee:[[4,3,8,11],[1,3,4,4],[11,3,4,4]],
 book:[[2,2,12,12],[7,2,2,12,"#FFF7F2"]],frame:[[1,2,14,11],[3,4,10,7,"#FFF7F2"]],case:[[1,5,14,8],[6,2,4,3],[7,8,2,2,"#FFF7F2"]],
 note:[[5,3,2,9],[11,3,2,9],[5,2,8,2],[3,10,4,3],[9,10,4,3]],
 emo:[[3,2,10,12],[5,5,2,2,"#FFF7F2"],[9,5,2,2,"#FFF7F2"],[5,9,6,1,"#FFF7F2"],[6,10,4,1,"#FFF7F2"]],
 clip:[[4,1,8,14],[5,3,6,9,"#FFF7F2"],[7,6,3,3]],
 fund:[[4,3,3,1],[9,3,3,1],[3,4,10,2],[4,6,8,1],[5,7,6,1],[6,8,4,1],[7,9,2,1]]};

function ogqReject(v){
  if(v.pad<8)return{r:"여백 부족",x:`이모티콘 여백이 ${v.pad}px예요. 8px 이상 필요해요`,fix:"여백을 8px 이상으로"};

  if(v.set>=40)return{r:"유사도 높음",x:`${v.set}종을 우겨넣어 비슷한 표정이 많대요. 종수를 줄이거나 표정을 다양하게`,fix:"종수를 줄이고 표정 다양화"};
  return null;
}

function fmt(d,v){
  if(d.i==="tone")return TONE[v];
  if(d.i==="hook")return ["아주 약","약","보통","셈","아주 셈"][v];
  if(d.i==="trend")return ["안 따름","살짝","보통","적극","완전 유행"][v];
  if(d.i==="topic")return ["자유","느슨","시리즈"][v];
  if(d.i==="info")return ["감성","감성 우세","반반","정보 우세","정보"][v];
  if(d.i==="sz")return ["A5","B5","A4"][v];
  if(d.i==="sp")return ["작게","중간","크게"][v];
  if(d.i==="res")return ["낮음","보통","높음"][v];
  if(d.i==="move")return ["멈춤","조금","크게"][v];
  if(d.i==="ani")return v?"있음":"없음";
  if(d.i==="tell")return v?"고지 함":"안 함";
  if(d.i==="agg")return ["아주 조심","조심","보통","적극","아주 적극"][v];
  return v+(d.u||"");}

      <div class="pfb"><span class="pb t">채널 ${L.filter(c=>c.k==="real").length}곳</span><span class="pb t">작업물 ${total}종</span>
      <span class="pb g">라인 승인</span>${pass?'<span class="pb g">OGQ 승인</span>':'<span class="pb">OGQ 재도전 중</span>'}
      <span class="pb y">ISBN 발급</span>${ST.tb.on&&ST.tb.v.tell?'<span class="pb y">텀블벅 진행</span>':''}</div></div>
    <div class="wg">${works}</div>
    <div class="share">공유 링크 — portfolio.ync.ac.kr/s/야근냥-${CYC}</div></div></div>
  <div class="sec"><div class="st">떨어지고 다시 한 이야기</div><div class="body">
    <div class="tl"><div class="no"><span class="w">2주</span>OGQ마켓에서 <b>떨어졌어요</b> — 여백 부족</div>
      <div><span class="w">3주</span>이유를 찾아서 전부 다시 다듬었어요 (여백 ${pad}px · 해상도 ${["낮음","보통","높음"][ST.ogq.v.res]})</div>
      ${pass?'<div class="ok"><span class="w">4주</span><b>두 번째에 통과</b></div>':`<div class="no"><span class="w">지금</span>아직 막혀 있어요 — ${rj.r}</div>`}</div>
    <div style="font-size:13px;color:var(--ink2);margin-top:13px">한 번에 붙은 기록보다 <b style="color:var(--ink)">막혔을 때 어떻게 했는지</b>가 더 궁금한 정보예요. 포트폴리오엔 "만들었습니다"가 아니라 "올렸고 이런 반응이 있었습니다"가 남아요.</div>
    <div class="money"><span class="ml">지금까지 번 돈 (참고용 · 점수에 안 들어갑니다)</span><span class="mv">${N(money)}원</span></div>
  </div></div>`;
}

function render(){
  $("console").hidden=TAB!==1;$("folio").hidden=TAB!==2;
  $("tb1").setAttribute("aria-selected",TAB===1);$("tb2").setAttribute("aria-selected",TAB===2);
  $("avat").innerHTML=cat(mood(),46);
  if(TAB===1){front();grid();detail();calendar();perf()}else folio();
  let a=0,t=0,w=0;
  CH.forEach(c=>{const s=ST[c.id];if(!s.on)return;a++;const o=c.out(s.v);t+=o.cnt;if(s.ag)w+=o.weekly});
  $("s0").textContent=CYC;$("s1").textContent=a;$("s2").textContent=ART?t:0;$("s3").textContent=ART?w:0;
}
$("tb1").onclick=()=>{TAB=1;render()};
$("tb2").onclick=()=>{TAB=2;render()};
$("run").onclick=()=>{
  const L=$("log");L.innerHTML="";
  const add=(t,c)=>{L.innerHTML+=`<div class="${c||""}">${t}</div>`;L.scrollTop=L.scrollHeight};
  if(!ART){add("잠깐 — 내 그림이 아직 없어요. 1단계부터 해주세요","hd");return}
  const on=CH.filter(c=>ST[c.id].on);
  if(!on.length){add("잠깐 — 켜둔 채널이 하나도 없어요","hd");return}
  add(`${CYC}번째 사이클 · 컨셉 "${CN[CONCEPT]}"으로 시작합니다`);
  let i=0;
  const tick=setInterval(()=>{
    if(i>=on.length){add(`다 올렸어요 — ${on.length}곳. 이제 반응을 모읍니다`,"ok");PREV=LAST;LAST=snap();DEP=1;render();clearInterval(tick);return}
    const c=on[i],s=ST[c.id],o=c.out(s.v);i++;
    if(o.block){add(`${c.n} — 규격·규정이 안 맞아 보류했어요`,"hd");return}
    if(c.k==="virt"){add(`${c.n} — 가상으로 체험 완료`,"vt");return}
    if(!s.ag){add(`${c.n} — 담당이 없어서 직접 올려야 해요`,"hd");return}
    add(`${c.n} — 학생 승인 받고 올렸어요 · ${o.cnt}종${o.weekly?` · 주 ${o.weekly}번 예약`:""}`,"ok");
  },300);
};
render();
</script>
